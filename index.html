<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>My project</title>
    <style>
        /* نخفي مشغل الصوت تمامًا */
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <audio id="player" src="Sugar_Brownies-Dharia_Arabic_sub_Lyrics(M4A_128K).m4a" autoplay loop muted></audio>

    <script>
        window.addEventListener("load", function() {
            var audio = document.getElementById("player");
            // تشغيل الأغنية تلقائيًا
            audio.play().then(() => {
                // بعد ثانية نرفع الصوت
                setTimeout(() => {
                    audio.muted = false;
                }, 1000);
            }).catch(err => {
                console.log("المتصفح منع التشغيل التلقائي:", err);
            });
        });
    </script>
</body>
</html>
